name: Current Module production and editor
on:
  pull_request:
permissions:
  contents: read
jobs:
  current-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/pcg/archives/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - run: npm run test:production
      - run: python3 tools/build_editor_site.py --out dist
