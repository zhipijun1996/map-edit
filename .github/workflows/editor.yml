name: Editor and repository module library
on:
  pull_request:
    paths:
      - '*.js'
      - '*.html'
      - '*.css'
      - 'package.json'
      - 'library/**'
      - 'tools/**'
      - '.github/workflows/editor.yml'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
jobs:
  editor-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .agents
            archive/mapgen-failed
            library
            tools
            pcg/module_library
            pcg/prototype
            pcg/contract
            pcg/tools
            pcg/feedback
            pcg/research
            pcg/regions
            pcg/archives/module-library-evidence-v1
            generation/contracts
            generation/workshop
            generation/videos
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
