name: Editor and repository module library
on:
  pull_request:
    paths:
      - '*.js'
      - '*.html'
      - '*.css'
      - 'package.json'
      - 'library/**'
      - 'modules/**'
      - 'modules-recycle/**'
      - 'MAP_FOUNDATION.md'
      - 'MAP_GENERATION_GUIDE.md'
      - 'tools/**'
      - '.github/workflows/editor.yml'
      - '.github/workflows/pages.yml'
permissions:
  contents: read
jobs:
  editor-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
