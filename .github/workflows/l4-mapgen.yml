name: L4 map generation research
on:
  pull_request:
    paths:
      - 'experiments/l4-mapgen/**'
      - 'docs/l4-mapgen/**'
      - '.github/workflows/l4-mapgen.yml'
      - 'package.json'
      - 'pcg/map_directed/**'
      - 'pcg/prototype/plains/**'
      - 'pcg/prototype/workshop/**'
      - 'pcg/OUTPUT-CONTRACT.md'
      - 'module-block-grid.js'
      - 'module-contract.js'
  push:
    branches: ['research/l4-map-generator']
    paths:
      - 'experiments/l4-mapgen/**'
      - 'docs/l4-mapgen/**'
      - '.github/workflows/l4-mapgen.yml'
      - 'package.json'
      - 'pcg/map_directed/**'
      - 'pcg/prototype/plains/**'
      - 'pcg/prototype/workshop/**'
      - 'pcg/OUTPUT-CONTRACT.md'
      - 'module-block-grid.js'
      - 'module-contract.js'
permissions:
  contents: read
jobs:
  map-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r experiments/l4-mapgen/requirements.txt networkx==3.5
      - name: Check Map and Block contracts
        run: |
          node tools/contract-tests/check-contract.mjs
          node tools/contract-tests/check-block-grid.mjs
          node tools/contract-tests/check-block-staging.mjs
          python3 -m unittest discover -s pcg/map_directed/tests -v
      - name: Check existing R2 research kernel
        run: |
          npm run check:mapgen
          python3 experiments/l4-mapgen/check_artifacts.py
          node --check experiments/l4-mapgen/viewer.js
      - name: Check this Map's actual persisted Module documents
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pcg.tools.restore_archive import open_parts,ROOT
          prefix='results/graph-map-whole-evaluation-v2/module-library/documents/'
          with open_parts('graph-map-materialization-v1') as archive:
              index=json.loads(archive.read('PCG-ARCHIVE-INDEX.json'))
              selected={name:info for name,info in index.items() if name.startswith(prefix)}
              assert len([name for name in selected if name.endswith('.mapnote.json')])==22
              for name,info in selected.items():
                  target=ROOT/name
                  assert target.resolve().is_relative_to(ROOT.resolve())
                  data=archive.read(info.get('archive_entry',name))
                  assert len(data)==info['bytes'] and hashlib.sha256(data).hexdigest()==info['sha256']
                  if target.exists(): assert target.read_bytes()==data
                  else: target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          PY
          node pcg/map_directed/direct_join/verify_catalog.mjs pcg/results/graph-map-whole-evaluation-v2/module-library/documents/manifest.json
