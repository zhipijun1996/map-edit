name: Sync game module library
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Game branch, tag or commit
        required: true
        default: main
        type: string
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: module-library-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Godot data extractor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/map-notes-godot
          gh release download 4.7.2-stable -R godotengine/godot-builds -p Godot_v4.7.2-stable_linux.x86_64.zip -D /tmp/map-notes-godot
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/map-notes-godot/Godot_v4.7.2-stable_linux.x86_64.zip' | sha256sum -c -
          python3 -m zipfile -e /tmp/map-notes-godot/Godot_v4.7.2-stable_linux.x86_64.zip /tmp/map-notes-godot
          chmod +x /tmp/map-notes-godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Refresh source, extract, classify and validate
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/sync_library.py --ref "$SOURCE_REF" --godot /tmp/map-notes-godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Commit verified library
        id: commit
        run: |
          git add library
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Sync verified game module library"
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/pages.yml
