name: Deploy editor
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - name: Prepare static files
        run: |
          mkdir -p dist/library
          cp index.html style.css app.js model.js capabilities.js difficulty.js library-client.js dist/
          cp library/catalog.json library/coverage.json dist/library/
          cp -r library/modules library/thumbnails dist/library/
          mkdir -p dist/experiments/l4-mapgen/results dist/docs
          cp experiments/l4-mapgen/viewer.html experiments/l4-mapgen/viewer.js experiments/l4-mapgen/viewer.css experiments/l4-mapgen/*.md experiments/l4-mapgen/*.py experiments/l4-mapgen/*.json experiments/l4-mapgen/*.txt dist/experiments/l4-mapgen/
          cp -r experiments/l4-mapgen/results experiments/l4-mapgen/failure_evidence experiments/l4-mapgen/godot dist/experiments/l4-mapgen/
          cp -r docs/l4-mapgen dist/docs/
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
