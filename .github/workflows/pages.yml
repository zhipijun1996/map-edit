name: Deploy generation workspace and editor
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check offline factory contracts
        run: python3 -m unittest discover -s prototype/factory/tests -v
        working-directory: pcg
      - name: Verify generation videos and archived data
        run: python3 tools/check_generation.py
      - name: Prepare static files
        run: |
          mkdir -p dist/library
          cp index.html style.css app.js model.js capabilities.js difficulty.js library-client.js dist/
          cp library/catalog.json library/coverage.json dist/library/
          cp -r library/modules library/thumbnails dist/library/
          cp -r generation dist/generation
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
