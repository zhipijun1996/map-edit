 font-weight="700" class="label">L</text><text x="40" y="868.0" font-size="22" fill="#263c37" text-anchor="start" font-weight="600" class="label">曲线是动作意图，矩阵是逐方向目标；身体、时机、资源和接缝均UNKNOWN。</text><rect x="400" y="887.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="450.0" y="908.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">起点→终点</text><rect x="500" y="887.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="550.0" y="908.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">L</text><rect x="400" y="916.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="450.0" y="937.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">L</text><rect x="500" y="916.0" width="100" height="29" fill="#e3eee1" stroke="#c7d0c4"/><text x="550.0" y="937.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">目标</text><text x="40" y="1113.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">入口先决定：留空怪走上短线，还是清场后绕岛下方追台。</text><text x="40" y="1145.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">青线：诱冲→掠过空怪→回射续枪→修正进宝库；蓝线：P换Q后再入同一凹口。</text><text x="40" y="1177.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">同一只空怪只影响右侧会合区，原生下扑约50px，不假设全房追击。</text><text x="40" y="1209.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">橙线取箱后走低位返回，不依赖活怪；无启停铃，不额外添加一次无意义开关。</text><text x="40" y="1264.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">青＝主线　蓝＝替代/准备线　橙＝状态改变后/回程　虚框＝动态另一位置　外虚线只是Block占用</text><text x="40" y="1298.0" font-size="18" fill="#263c37" text-anchor="start" font-weight="400" class="label">设计稿：每格 128 px；曲线仅表达玩法意图，不代表实际动作、可达性或技术认证。</text><text x="40" y="1332.0" font-size="16" fill="#263c37" text-anchor="start" font-weight="400" class="label">12×7 Block · idea-plains-large-02-001 · 设计讨论</text></svg>