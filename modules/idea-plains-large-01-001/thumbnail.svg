 fill="#e3eee1" stroke="#c7d0c4"/><text x="550.0" y="937.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">目标</text><text x="40" y="1113.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">① 先看井下P的接回位置，再借A长桥绕到宝库右侧。</text><text x="40" y="1145.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">② 右岸诱冲上高位；③ 回射之后A消失、B开，整条下层路线改变。</text><text x="40" y="1177.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">④ 绕裙底接回P，从井口取箱；箱后也靠P回原入口，不能再走A。</text><text x="40" y="1209.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">怪物参与右岸起跳和下降判断；允许清怪或不停P的替代，不把固定按键当唯一解。</text><text x="40" y="1264.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">青＝主线　蓝＝替代/准备线　橙＝状态改变后/回程　虚框＝动态另一位置　外虚线只是Block占用</text><text x="40" y="1298.0" font-size="18" fill="#263c37" text-anchor="start" font-weight="400" class="label">设计稿：每格 128 px；曲线仅表达玩法意图，不代表实际动作、可达性或技术认证。</text><text x="40" y="1332.0" font-size="16" fill="#263c37" text-anchor="start" font-weight="400" class="label">12×8 Block · idea-plains-large-01-001 · 设计讨论</text></svg>