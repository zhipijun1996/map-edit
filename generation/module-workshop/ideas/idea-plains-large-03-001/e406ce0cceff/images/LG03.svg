xt x="40" y="1264.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">青＝主线　蓝＝替代/准备线　橙＝状态改变后/回程　虚框＝动态另一位置　外虚线只是Block占用</text><text x="40" y="1298.0" font-size="18" fill="#263c37" text-anchor="start" font-weight="400" class="label">设计稿：每格 128 px；曲线仅表达玩法意图，不代表实际动作、可达性或技术认证。</text><text x="40" y="1332.0" font-size="16" fill="#263c37" text-anchor="start" font-weight="400" class="label">12×7 Block · idea-plains-large-03-001 · 设计讨论</text></svg>