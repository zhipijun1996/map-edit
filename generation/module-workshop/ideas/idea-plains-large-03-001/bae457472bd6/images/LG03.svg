t="22" rx="3" fill="#ecc65b" stroke="#956b25" stroke-width="2"/><text x="1135.625" y="374.625" font-size="19" fill="#263c37" text-anchor="middle" font-weight="400" class="label">实体内室中的宝箱</text><circle cx="220.0" cy="680.0" r="11" fill="white" stroke="#256776" stroke-width="3"/><path d="M207.0 680.0L177.0 680.0" stroke="#256776" stroke-width="3" marker-end="url(#arrow)"/><text x="157.0" y="688.0" font-size="28" fill="#263c37" text-anchor="middle" font-weight="700" class="label">L</text><text x="40" y="868.0" font-size="22" fill="#263c37" text-anchor="start" font-weight="600" class="label">曲线是动作意图，矩阵是逐方向目标；身体、时机、资源和接缝均UNKNOWN。</text><rect x="400" y="887.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="450.0" y="908.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">起点→终点</text><rect x="500" y="887.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="550.0" y="908.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">L</text><rect x="400" y="916.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="450.0" y="937.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">L</text><rect x="500" y="916.0" width="100" height="29" fill="#e3eee1" stroke="#c7d0c4"/><text x="550.0" y="937.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">目标</text><text x="40" y="1113.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">① 三面墙贯通外壳，只有洞口能穿；上跳无法绕到墙背后的宝箱。</text><text x="40" y="1145.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">② 洞口上下移动，必须瞄准“身体到达时”的位置；过口后刹进短岸。</text><text x="40" y="1177.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">③ 三口不同周期；每段能落地观察，避免一串固定按键。</text><text x="40" y="1209.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">④ 联动洞口与防夹缺规则；运动区始终补满岩墙，不能出现上下缝隙。</text><text x="40" y="1264.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">深绿实体岩层阻挡身体/弹丸　青线去程　橙线回程　图示不是物理认证</text><text x="40" y="1298.0" font-size="18" fill="#263c37" text-anchor="start" font-weight="400" class="label">设计稿：每格 128 px；曲线仅表达玩法意图，不代表实际动作、可达性或技术认证。</text><text x="40" y="1332.0" font-size="16" fill="#263c37" text-anchor="start" font-weight="400" class="label">10×7 Block · idea-plains-large-03-001 · 设计讨论</text></svg>