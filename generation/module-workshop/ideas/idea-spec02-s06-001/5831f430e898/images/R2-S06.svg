 stroke-width="3.5" fill="none" marker-end="url(#arrow)"/><circle cx="749.1666666666666" cy="676.875" r="7" fill="#3b79c9"/><path d="M749.1666666666666 676.875L865.8333333333333 771.6666666666667" fill="none" stroke="#3b79c9" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="647.0833333333333" y="757.0833333333334" font-size="18" fill="#263c37" text-anchor="middle" font-weight="400" class="label">绕台下射铃 → 反冲左上／载台左上启动</text><path d="M749.1666666666666 676.875L690.8333333333333 629.4791666666667" fill="none" stroke="#30905c" stroke-width="4" marker-end="url(#arrow)"/><polyline points="865.8333333333333,684.1666666666667 865.8333333333333,704.21875" fill="none" stroke="#c75049" stroke-width="3.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M857.8333333333333 696.21875L873.8333333333333 712.21875M873.8333333333333 696.21875L857.8333333333333 712.21875" stroke="#c75049" stroke-width="4"/><text x="805.6770833333333" y="669.5833333333334" font-size="18" fill="#263c37" text-anchor="middle" font-weight="400" class="label">站台直射被实体挡住</text><rect x="738.2291666666666" y="660.46875" width="21.875" height="32.8125" rx="5.46875" fill="#5b91bf" fill-opacity=".65" stroke="#315c84" stroke-width="2"/><text x="678.0729166666666" y="644.0625" font-size="19" fill="#263c37" text-anchor="middle" font-weight="400" class="label">先跃到台侧外</text><path d="M865.8333333333333 771.6666666666667L865.8333333333333 713.3333333333334" stroke="#ad8a35" stroke-width="1.5" stroke-dasharray="4 5"/><circle cx="865.8333333333333" cy="771.6666666666667" r="11" fill="#dfbc51" stroke="#9d7a29" stroke-width="2"/><text x="865.8333333333333" y="753.6666666666667" font-size="19" fill="#263c37" text-anchor="middle" font-weight="400" class="label">台下挂铃 · 随P移动</text><circle cx="545.0" cy="130.0" r="11" fill="white" stroke="#256776" stroke-width="3"/><path d="M545.0 101.0V159.0" stroke="#256776" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="563.0" y="112.0" font-size="22" fill="#263c37" text-anchor="start" font-weight="700" class="label">T 可穿·双向</text><circle cx="895.0" cy="830.0" r="11" fill="white" stroke="#256776" stroke-width="3"/><path d="M895.0 801.0V859.0" stroke="#256776" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="913.0" y="812.0" font-size="22" fill="#263c37" text-anchor="start" font-weight="700" class="label">B 可穿·双向</text><text x="40" y="868.0" font-size="22" fill="#263c37" text-anchor="start" font-weight="600" class="label">曲线是动作意图，矩阵是逐方向目标；身体、时机、资源和接缝均UNKNOWN。</text><rect x="400" y="887.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="450.0" y="908.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">起点→终点</text><rect x="500" y="887.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="550.0" y="908.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">T</text><rect x="600" y="887.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="650.0" y="908.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">B</text><rect x="400" y="916.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="450.0" y="937.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">T</text><rect x="500" y="916.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="550.0" y="937.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">—</text><rect x="600" y="916.0" width="100" height="29" fill="#e3eee1" stroke="#c7d0c4"/><text x="650.0" y="937.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">目标</text><rect x="400" y="945.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="450.0" y="966.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">B</text><rect x="500" y="945.0" width="100" height="29" fill="#e3eee1" stroke="#c7d0c4"/><text x="550.0" y="966.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">目标</text><rect x="600" y="945.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="650.0" y="966.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">—</text><text x="40" y="1113.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">① 台下的铃随同一实体台移动；站在台上直射会先碰台，红叉为示意。</text><text x="40" y="1145.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">② 先向侧面跃离，绕台下击铃；同枪反冲与被启动的左上升台形成追接。</text><text x="40" y="1177.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">③ 不加“仅空中可射”限制；站边提前射铃如果仍能轻松坐完，是必须保留的反例。</text><text x="40" y="1209.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">④ 虚框是同台轨道端点；随台接收绑定、真实追接/回程均待实现验证。</text><text x="40" y="1264.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">绿＝固定地貌／可穿岸　紫＝井盖或互补支撑　红＝已伸出地刺／原生怪　虚框＝另一相位/状态</text><text x="40" y="1298.0" font-size="18" fill="#263c37" text-anchor="start" font-weight="400" class="label">设计稿：每格 128 px；曲线仅表达玩法意图，不代表实际动作、可达性或技术认证。</text><text x="40" y="1332.0" font-size="16" fill="#263c37" text-anchor="start" font-weight="400" class="label">4×6 Block · idea-spec02-s06-001 · 设计讨论</text></svg>