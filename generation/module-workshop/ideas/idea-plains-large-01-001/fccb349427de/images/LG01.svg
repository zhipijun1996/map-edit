 y="937.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">目标</text><text x="40" y="1113.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">① P斜升→Q横移→R竖升，跃离时射身后铃；不是停好三台再走安全楼梯。</text><text x="40" y="1145.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">② 停位保留，去程留下的台决定取宝后的返回支点；回程必要时独立重启。</text><text x="40" y="1177.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">③ 地刺附着底部岩床；两低台只服务重试。真实相位、落台和回程尚未验证。</text><text x="40" y="1232.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">青线＝去程　橙线＝取宝后回程　蓝虚线＝射击　绿箭头＝反冲　虚框＝轨道端点</text><text x="40" y="1266.0" font-size="18" fill="#263c37" text-anchor="start" font-weight="400" class="label">设计稿：每格 128 px；曲线仅表达玩法意图，不代表实际动作、可达性或技术认证。</text><text x="40" y="1300.0" font-size="16" fill="#263c37" text-anchor="start" font-weight="400" class="label">10×7 Block · idea-plains-large-01-001 · 设计讨论</text></svg>