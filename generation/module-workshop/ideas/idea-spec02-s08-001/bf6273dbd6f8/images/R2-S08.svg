37" text-anchor="start" font-weight="400" class="label">② 红刺贴檐上下表面，檐顶不是安全中转；全身体过檐和穿伤绕法待验。</text><text x="40" y="1200.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">绿岩／浅绿可穿接岸　实体载台另标　红＝真实地刺/齿轮　曲线＝动作意图，非物理证据</text><text x="40" y="1234.0" font-size="18" fill="#263c37" text-anchor="start" font-weight="400" class="label">设计稿：每格 128 px；曲线仅表达玩法意图，不代表实际动作、可达性或技术认证。</text><text x="40" y="1268.0" font-size="16" fill="#263c37" text-anchor="start" font-weight="400" class="label">4×3 Block · idea-spec02-s08-001 · 设计讨论</text></svg>