 font-weight="400" class="label">目标</text><rect x="600" y="945.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="650.0" y="966.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">—</text><text x="40" y="1113.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">① 两端ROCK岩岸，台面高差128px；只有两块地貌，不加中间垫台。</text><text x="40" y="1145.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">② 正向短跳/反冲补高，反向控落；普通跳能过就接受。</text><text x="40" y="1177.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">③ 复用基础抬升家族的3×2接口适配，不计新玩法。</text><text x="40" y="1232.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">深绿＝岩体　浅绿＝可穿　左右口ROCK、上下口可穿，均INOUT；虚边不是墙</text><text x="40" y="1266.0" font-size="18" fill="#263c37" text-anchor="start" font-weight="400" class="label">设计稿：每格 128 px；曲线仅表达玩法意图，不代表实际动作、可达性或技术认证。</text><text x="40" y="1300.0" font-size="16" fill="#263c37" text-anchor="start" font-weight="400" class="label">3×2 Block · idea-interface-s15-001 · 设计讨论</text></svg>