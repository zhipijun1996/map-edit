" text-anchor="start" font-weight="400" class="label">③ 第一段落稳后第二段更高；回程各门远侧可重开。</text><text x="40" y="1209.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">④ 炮台与弹丸资格明确缺Cell；时长须保留可读的多帧窗口。</text><text x="40" y="1264.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">深绿实体岩层阻挡身体/弹丸　青线去程　橙线回程　图示不是物理认证</text><text x="40" y="1298.0" font-size="18" fill="#263c37" text-anchor="start" font-weight="400" class="label">设计稿：每格 128 px；曲线仅表达玩法意图，不代表实际动作、可达性或技术认证。</text><text x="40" y="1332.0" font-size="16" fill="#263c37" text-anchor="start" font-weight="400" class="label">10×7 Block · idea-plains-large-02-001 · 设计讨论</text></svg>