 font-weight="400" class="label">L</text><rect x="400" y="916.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="450.0" y="937.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">L</text><rect x="500" y="916.0" width="100" height="29" fill="#e3eee1" stroke="#c7d0c4"/><text x="550.0" y="937.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">目标</text><text x="40" y="1113.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">① 两道独立限时门：门洞在实岩墙之间，不靠一根短门阻挡越顶。</text><text x="40" y="1145.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">② 去程每次空中回射同时开门和反冲；中台真实落地恢复，再开始下一段。</text><text x="40" y="1177.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">③ 箱前竖锯后要向前开枪刹住短岸；回程各侧重新开门，不继承永久开启。</text><text x="40" y="1209.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">④ 时长按弹丸/身体/容错求解，防夹须复核完整身体；所有数值与成功率UNKNOWN。</text><text x="40" y="1264.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">青线＝去程　橙线＝取宝后回程　蓝虚线＝射击　绿箭头＝反冲　虚框＝轨道端点</text><text x="40" y="1298.0" font-size="18" fill="#263c37" text-anchor="start" font-weight="400" class="label">设计稿：每格 128 px；曲线仅表达玩法意图，不代表实际动作、可达性或技术认证。</text><text x="40" y="1332.0" font-size="16" fill="#263c37" text-anchor="start" font-weight="400" class="label">9×8 Block · idea-plains-large-02-001 · 设计讨论</text></svg>