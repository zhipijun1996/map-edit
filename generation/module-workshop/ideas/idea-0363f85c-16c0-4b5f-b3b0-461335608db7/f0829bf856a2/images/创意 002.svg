/><text x="550.0" y="937.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">目标</text><rect x="600" y="916.0" width="100" height="29" fill="#e3eee1" stroke="#c7d0c4"/><text x="650.0" y="937.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">目标</text><rect x="400" y="945.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="450.0" y="966.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">B</text><rect x="500" y="945.0" width="100" height="29" fill="#e3eee1" stroke="#c7d0c4"/><text x="550.0" y="966.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">目标</text><rect x="600" y="945.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="650.0" y="966.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">—</text><text x="40" y="1113.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">① 底台起跳；按编号命中2只空中怪，每次命中返还1发。</text><text x="40" y="1145.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">② 左下射击向右上反冲，右下射击向左上反冲；最后向下空枪上岸。</text><text x="40" y="1177.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">③ 失误回底台；怪物血量保留，可能耗尽目标；无限重试尚无恢复保证。</text><text x="40" y="1232.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">图例：蓝虚线＝子弹方向　绿箭头＝人物反冲　青线＝上升意图　橙色＝怪物</text><text x="40" y="1266.0" font-size="18" fill="#263c37" text-anchor="start" font-weight="400" class="label">设计稿：每格 128 px；曲线仅表达玩法意图，不代表实际动作、可达性或技术认证。</text><text x="40" y="1300.0" font-size="16" fill="#263c37" text-anchor="start" font-weight="400" class="label">3×4 Block · idea-0363f85c-16c0-4b5f-b3b0-461335608db7 · 设计讨论</text></svg>