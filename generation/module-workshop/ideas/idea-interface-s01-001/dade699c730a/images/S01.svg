—</text><rect x="600" y="1416.0" width="100" height="29" fill="#e3eee1" stroke="#c7d0c4"/><text x="650.0" y="1437.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">目标</text><rect x="400" y="1445.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="450.0" y="1466.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">B</text><rect x="500" y="1445.0" width="100" height="29" fill="#e3eee1" stroke="#c7d0c4"/><text x="550.0" y="1466.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">目标</text><rect x="600" y="1445.0" width="100" height="29" fill="#e3eee1" stroke="#c7d0c4"/><text x="650.0" y="1466.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">目标</text><text x="40" y="1613.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">① 先登128px准备台，再执行双靶续枪；本版并非从底岸一口气飞满3×5。</text><text x="40" y="1645.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">② 蓝虚线＝射击，绿箭头＝反冲；怪物位置只是目标相位示意。</text><text x="40" y="1677.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">③ 敌已死/重试/回程未验证；不继承旧3×4版本的认可。</text><text x="40" y="1732.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">深绿＝岩体　浅绿＝可穿　左右口ROCK、上下口可穿，均INOUT；虚边不是墙</text><text x="40" y="1766.0" font-size="18" fill="#263c37" text-anchor="start" font-weight="400" class="label">设计稿：每格 128 px；曲线仅表达玩法意图，不代表实际动作、可达性或技术认证。</text><text x="40" y="1800.0" font-size="16" fill="#263c37" text-anchor="start" font-weight="400" class="label">3×5 Block · idea-interface-s01-001 · 设计讨论</text></svg>