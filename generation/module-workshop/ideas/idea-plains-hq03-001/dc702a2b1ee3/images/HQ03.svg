100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="450.0" y="966.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">R</text><rect x="500" y="945.0" width="100" height="29" fill="#e3eee1" stroke="#c7d0c4"/><text x="550.0" y="966.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">目标</text><rect x="600" y="945.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="650.0" y="966.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">—</text><rect x="700" y="945.0" width="100" height="29" fill="#e3eee1" stroke="#c7d0c4"/><text x="750.0" y="966.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">目标</text><rect x="400" y="974.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="450.0" y="995.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">T</text><rect x="500" y="974.0" width="100" height="29" fill="#e3eee1" stroke="#c7d0c4"/><text x="550.0" y="995.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">目标</text><rect x="600" y="974.0" width="100" height="29" fill="#e3eee1" stroke="#c7d0c4"/><text x="650.0" y="995.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">目标</text><rect x="700" y="974.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="750.0" y="995.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">—</text><text x="40" y="1113.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">① 蓝人先在一侧诱导，等怪承诺冲锋后跃过；橙线是该轮冲向，不是撞墙眩晕。</text><text x="40" y="1145.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">② 局部岩檐阻挡岸上直接高跳/远射；是否仍能安全清怪或直接绕过，需验证。</text><text x="40" y="1177.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">③ 左右与上口分别声明六向目标；敌死后仍须有路，不用活敌充当唯一钥匙。</text><text x="40" y="1232.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">橙怪＝冲锋怪　橙线＝该轮方向　蓝人＝诱导站位　蓝虚线/绿箭头＝射击/反冲</text><text x="40" y="1266.0" font-size="18" fill="#263c37" text-anchor="start" font-weight="400" class="label">设计稿：每格 128 px；曲线仅表达玩法意图，不代表实际动作、可达性或技术认证。</text><text x="40" y="1300.0" font-size="16" fill="#263c37" text-anchor="start" font-weight="400" class="label">4×3 Block · idea-plains-hq03-001 · 设计讨论</text></svg>