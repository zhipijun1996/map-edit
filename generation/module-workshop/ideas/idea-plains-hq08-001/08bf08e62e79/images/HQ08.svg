37" text-anchor="start" font-weight="400" class="label">② 恢复原枪次的同次落地启动下降：等锯让路，会付出高度。</text><text x="40" y="1177.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">③ 台按原往复返回，不能假设一次性坠毁或瞬间复位；安全久等是否无聊须审查。</text><text x="40" y="1232.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">深绿岩体／浅绿可穿台　主载台实体　蓝线玩家弹／紫线机关弹　虚框同台另一状态</text><text x="40" y="1266.0" font-size="18" fill="#263c37" text-anchor="start" font-weight="400" class="label">设计稿：每格 128 px；曲线仅表达玩法意图，不代表实际动作、可达性或技术认证。</text><text x="40" y="1300.0" font-size="16" fill="#263c37" text-anchor="start" font-weight="400" class="label">4×4 Block · idea-plains-hq08-001 · 设计讨论</text></svg>