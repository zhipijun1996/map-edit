s="label">T</text><rect x="600" y="1387.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="650.0" y="1408.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">B</text><rect x="400" y="1416.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="450.0" y="1437.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">T</text><rect x="500" y="1416.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="550.0" y="1437.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">—</text><rect x="600" y="1416.0" width="100" height="29" fill="#e3eee1" stroke="#c7d0c4"/><text x="650.0" y="1437.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">目标</text><rect x="400" y="1445.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="450.0" y="1466.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">B</text><rect x="500" y="1445.0" width="100" height="29" fill="#e3eee1" stroke="#c7d0c4"/><text x="550.0" y="1466.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">目标</text><rect x="600" y="1445.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="650.0" y="1466.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">—</text><text x="40" y="1613.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">① 同一枚竖锯扫过不同高度，横跨时读它的未来位置。</text><text x="40" y="1645.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">② 下行可跨层，但不是默认直落到底；每台的上返与恢复用途都要检验。</text><text x="40" y="1700.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">绿岩／浅绿可穿接岸　实体载台另标　红＝真实地刺/齿轮　曲线＝动作意图，非物理证据</text><text x="40" y="1734.0" font-size="18" fill="#263c37" text-anchor="start" font-weight="400" class="label">设计稿：每格 128 px；曲线仅表达玩法意图，不代表实际动作、可达性或技