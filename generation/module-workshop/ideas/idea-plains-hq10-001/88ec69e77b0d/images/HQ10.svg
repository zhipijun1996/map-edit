ight="400" class="label">—</text><text x="40" y="1113.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">① 实台插入井内，能落脚但不能下穿；虚框是收进侧袋后的同一台。</text><text x="40" y="1145.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">② 三只访问铃控制同一台，原生启动/暂停，不能一枪自动精确收至端点。</text><text x="40" y="1177.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">③ L/T/B逐向目标，允许部分路线简单跳过；8px侧缝与32px侧槽须完整身体验证。</text><text x="40" y="1232.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">深绿岩体／浅绿可穿台　主载台实体　蓝线玩家弹／紫线机关弹　虚框同台另一状态</text><text x="40" y="1266.0" font-size="18" fill="#263c37" text-anchor="start" font-weight="400" class="label">设计稿：每格 128 px；曲线仅表达玩法意图，不代表实际动作、可达性或技术认证。</text><text x="40" y="1300.0" font-size="16" fill="#263c37" text-anchor="start" font-weight="400" class="label">3×4 Block · idea-plains-hq10-001 · 设计讨论</text></svg>