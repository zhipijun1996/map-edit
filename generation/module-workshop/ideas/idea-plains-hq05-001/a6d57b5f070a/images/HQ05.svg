or="middle" font-weight="400" class="label">T</text><rect x="500" y="945.0" width="100" height="29" fill="#e3eee1" stroke="#c7d0c4"/><text x="550.0" y="966.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">目标</text><rect x="600" y="945.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="650.0" y="966.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">—</text><text x="40" y="1113.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">① 蓝折线是同一发子弹，橙箭头仅为最初反冲；镜面不补枪、不再推玩家。</text><text x="40" y="1145.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">② 左柱有32px高弹丸窗，身体不可据此通过；镜角/弹丸净空仍待真实验证。</text><text x="40" y="1177.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">③ 可先落短接岸再跳穿门，漏窗能重试；镜面Cell和实际开门窗口均未实现。</text><text x="40" y="1232.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">蓝折线＝弹丸长路　橙箭头＝一次反冲　青线＝人物路线意图　斜镜缺Cell；紫＝门</text><text x="40" y="1266.0" font-size="18" fill="#263c37" text-anchor="start" font-weight="400" class="label">设计稿：每格 128 px；曲线仅表达玩法意图，不代表实际动作、可达性或技术认证。</text><text x="40" y="1300.0" font-size="16" fill="#263c37" text-anchor="start" font-weight="400" class="label">4×3 Block · idea-plains-hq05-001 · 设计讨论</text></svg>