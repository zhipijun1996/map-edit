url(#arrow)"/><text x="132.0" y="663.0" font-size="28" fill="#263c37" text-anchor="middle" font-weight="700" class="label">L</text><text x="40" y="868.0" font-size="22" fill="#263c37" text-anchor="start" font-weight="600" class="label">曲线是动作意图，矩阵是逐方向目标；身体、时机、资源和接缝均UNKNOWN。</text><rect x="400" y="887.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="450.0" y="908.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">起点→终点</text><rect x="500" y="887.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="550.0" y="908.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">L</text><rect x="400" y="916.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="450.0" y="937.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">L</text><rect x="500" y="916.0" width="100" height="29" fill="#e3eee1" stroke="#c7d0c4"/><text x="550.0" y="937.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">目标</text><text x="40" y="1113.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">① L→L包含真实内部挑战、右台取奖和返回，不是入口附近转身。</text><text x="40" y="1145.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">② 刺檐限制高跳、移动锯惩罚过低，回程落岸更短；不自动换门、不送免费奖励。</text><text x="40" y="1200.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">绿岩／浅绿可穿接岸　实体载台另标　红＝真实地刺/齿轮　曲线＝动作意图，非物理证据</text><text x="40" y="1234.0" font-size="18" fill="#263c37" text-anchor="start" font-weight="400" class="label">设计稿：每格 128 px；曲线仅表达玩法意图，不代表实际动作、可达性或技术认证。</text><text x="40" y="1268.0" font-size="16" fill="#263c37" text-anchor="start" font-weight="400" class="label">3×2 Block · idea-spec02-s13-001 · 设计讨论</text></svg>