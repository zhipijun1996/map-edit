="3" stroke-dasharray="5 4" marker-end="url(#arrow)"/><polyline points="282.5,567.5 370.0,567.5 566.875,480.0 621.5625,469.0625 545.0,305.0 545.0,217.5 545.0,130.0 545.0,130.0" stroke="#157f84" stroke-opacity=".85" stroke-width="3.5" fill="none" marker-end="url(#arrow)"/><polyline points="550.6364311598646,593.3675697460881 709.0625,490.39062500000006" fill="none" stroke="#995cbd" stroke-width="3.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><path d="M701.0625 482.39062500000006L717.0625 498.39062500000006M717.0625 482.39062500000006L701.0625 498.39062500000006" stroke="#995cbd" stroke-width="4"/><text x="895.0" y="562.03125" font-size="18" fill="#263c37" text-anchor="middle" font-weight="400" class="label">竖板截弹</text><polyline points="730.9375,476.171875 946.953125,335.76171875" fill="none" stroke="#995cbd" stroke-width="3.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="908.671875" y="395.234375" font-size="18" fill="#263c37" text-anchor="middle" font-weight="400" class="label">板让开后：炮弹 → 风铃</text><polyline points="621.5625,469.0625 523.125,611.25" fill="none" stroke="#3b79c9" stroke-width="3.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/><text x="512.1875" y="463.59375" font-size="18" fill="#263c37" text-anchor="middle" font-weight="400" class="label">起跳向后下击炮</text><rect x="605.15625" y="444.453125" width="32.8125" height="49.21875" rx="8.203125" fill="#5b91bf" fill-opacity=".65" stroke="#315c84" stroke-width="2"/><text x="561.40625" y="419.84375" font-size="19" fill="#263c37" text-anchor="middle" font-weight="400" class="label">从固定台起跳</text><path d="M960.625 326.875L720.0 272.1875" stroke="#ad8a35" stroke-width="1.5" stroke-dasharray="4 5"/><circle cx="960.625" cy="326.875" r="11" fill="#dfbc51" stroke="#9d7a29" stroke-width="2"/><text x="960.625" y="308.875" font-size="19" fill="#263c37" text-anchor="middle" font-weight="400" class="label">开上方长门</text><path d="M545.0 217.5L720.0 272.1875" stroke="#ad8a35" stroke-width="1.5" stroke-dasharray="4 5"/><circle cx="545.0" cy="217.5" r="11" fill="#dfbc51" stroke="#9d7a29" stroke-width="2"/><text x="545.0" y="199.5" font-size="19" fill="#263c37" text-anchor="middle" font-weight="400" class="label">顶侧同门返回</text><path d="M380.9375 523.75L720.0 458.125" stroke="#ad8a35" stroke-width="1.5" stroke-dasharray="4 5"/><circle cx="380.9375" cy="523.75" r="11" fill="#dfbc51" stroke="#9d7a29" stroke-width="2"/><text x="380.9375" y="505.75" font-size="19" fill="#263c37" text-anchor="middle" font-weight="400" class="label">启停挡弹板（非载台）</text><circle cx="282.5" cy="567.5" r="11" fill="white" stroke="#256776" stroke-width="3"/><path d="M269.5 567.5L239.5 567.5" stroke="#256776" stroke-width="3" marker-end="url(#arrow)"/><text x="219.5" y="575.5" font-size="28" fill="#263c37" text-anchor="middle" font-weight="700" class="label">L</text><circle cx="545.0" cy="130.0" r="11" fill="white" stroke="#256776" stroke-width="3"/><path d="M545.0 101.0V159.0" stroke="#256776" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="563.0" y="112.0" font-size="22" fill="#263c37" text-anchor="start" font-weight="700" class="label">T 可穿·双向</text><text x="40" y="868.0" font-size="22" fill="#263c37" text-anchor="start" font-weight="600" class="label">曲线是动作意图，矩阵是逐方向目标；身体、时机、资源和接缝均UNKNOWN。</text><rect x="400" y="887.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="450.0" y="908.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">起点→终点</text><rect x="500" y="887.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="550.0" y="908.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">L</text><rect x="600" y="887.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="650.0" y="908.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">T</text><rect x="400" y="916.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="450.0" y="937.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">L</text><rect x="500" y="916.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="550.0" y="937.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">—</text><rect x="600" y="916.0" width="100" height="29" fill="#e3eee1" stroke="#c7d0c4"/><text x="650.0" y="937.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">目标</text><rect x="400" y="945.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="450.0" y="966.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">T</text><rect x="500" y="945.0" width="100" height="29" fill="#e3eee1" stroke="#c7d0c4"/><text x="550.0" y="966.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">目标</text><rect x="600" y="945.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="650.0" y="966.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">—</text><text x="40" y="1113.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">① 紫色上门延长到模块左右边界；闭门越过/绕端点仍须身体与边界验证。</text><text x="40" y="1145.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">② 蓝色细竖板只挡弹、人物可穿，不能站；这是缺碰撞规则的新Cell设计。</text><text x="40" y="1177.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">③ 人物改走固定起跳台与上返台；虚框是同一挡板下移后的状态。</text><text x="40" y="1209.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">④ 炮台可否被直接射铃替代仍是反例缺口；本稿不宣称已解决。</text><text x="40" y="1264.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">蓝竖板＝只挡弹／人物可穿（缺Cell）　绿台＝人物固定落点　紫＝长门／机关弹　蓝线＝玩家弹</text><text x="40" y="1298.0" font-size="18" fill="#263c37" text-anchor="start" font-weight="400" class="label">设计稿：每格 128 px；曲线仅表达玩法意图，不代表实际动作、可达性或技术认证。</text><text x="40" y="1332.0" font-size="16" fill="#263c37" text-anchor="start" font-weight="400" class="label">5×4 Block · idea-plains-hq09-001 · 设计讨论</text></svg>