</text><rect x="500" y="945.0" width="100" height="29" fill="#e3eee1" stroke="#c7d0c4"/><text x="550.0" y="966.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">目标</text><rect x="600" y="945.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="650.0" y="966.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">—</text><text x="40" y="1113.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">① 长门已删除。图中红刺为初态：出口可穿平台上下两面都伸刺。</text><text x="40" y="1145.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">② 目标铃触发后：上下尖刺收回，同一块平台恢复普通可穿落脚面。</text><text x="40" y="1177.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">③ 蓝竖板仍只挡弹、不承载；炮台与收刺控制绑定均尚未实现。</text><text x="40" y="1209.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">④ 邻接左侧带速跳入、侧绕/穿伤及T初始安全接岸仍待验证，不当物理封口。</text><text x="40" y="1264.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">红刺＝触发前伸出　击铃后上下刺收回／绿台保留　蓝竖板＝只挡弹　紫线＝机关弹</text><text x="40" y="1298.0" font-size="18" fill="#263c37" text-anchor="start" font-weight="400" class="label">设计稿：每格 128 px；曲线仅表达玩法意图，不代表实际动作、可达性或技术认证。</text><text x="40" y="1332.0" font-size="16" fill="#263c37" text-anchor="start" font-weight="400" class="label">5×4 Block · idea-plains-hq09-001 · 设计讨论</text></svg>