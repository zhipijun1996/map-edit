-size="18" fill="#263c37" text-anchor="middle" font-weight="400" class="label">回程上返 / 下行接回</text><rect x="600.0" y="730.0" width="480.0" height="15.0" fill="#9865bc" fill-opacity="0.85" stroke="#8056a2" stroke-width="2" /><text x="840.0" y="720.0" font-size="18" fill="#263c37" text-anchor="middle" font-weight="400" class="label">A初始实体：左段可站</text><rect x="600.0" y="850.0" width="480.0" height="15.0" fill="#9865bc" fill-opacity="0.13" stroke="#8056a2" stroke-width="2" stroke-dasharray="6 4"/><text x="840.0" y="840.0" font-size="18" fill="#263c37" text-anchor="middle" font-weight="400" class="label">B初始打开：切换后右段可站</text><polygon points="780.0,730.0 805.0,692.5 830.0,730.0" fill="#c75049" stroke="#903931" stroke-width="1.5"/><polygon points="830.0,730.0 855.0,692.5 880.0,730.0" fill="#c75049" stroke="#903931" stroke-width="1.5"/><polygon points="880.0,730.0 905.0,692.5 930.0,730.0" fill="#c75049" stroke="#903931" stroke-width="1.5"/><polygon points="930.0,730.0 955.0,692.5 980.0,730.0" fill="#c75049" stroke="#903931" stroke-width="1.5"/><polygon points="980.0,730.0 1005.0,692.5 1030.0,730.0" fill="#c75049" stroke="#903931" stroke-width="1.5"/><polygon points="1030.0,730.0 1055.0,692.5 1080.0,730.0" fill="#c75049" stroke="#903931" stroke-width="1.5"/><text x="930.0" y="683.5" font-size="18" fill="#263c37" text-anchor="middle" font-weight="400" class="label">该段实体时带刺</text><rect x="600.0" y="812.5" width="270.0" height="37.5" fill="#dbecf6" fill-opacity=".5" stroke="#3b79c9" stroke-width="2" stroke-dasharray="5 4"/><text x="735.0" y="800.5" font-size="18" fill="#263c37" text-anchor="middle" font-weight="400" class="label">切换后B左段伸刺（初态收回）</text><polyline points="360.0,490.0 480.0,490.0 690.0,670.0 750.0,610.0 960.0,790.0 960.0,1000.0 960.0,1210.0 960.0,1330.0 960.0,1330.0" stroke="#157f84" stroke-opacity=".85" stroke-width="3.5" fill="none" marker-end="url(#arrow)"/><circle cx="750.0" cy="610.0" r="7" fill="#3b79c9"/><path d="M750.0 610.0L630.0 640.0" fill="none" stroke="#3b79c9" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="750.0" y="977.5" font-size="18" fill="#263c37" text-anchor="middle" font-weight="400" class="label">同枪撤A／成B，并反冲换侧</text><path d="M750.0 610.0L870.0 580.0" fill="none" stroke="#30905c" stroke-width="4" marker-end="url(#arrow)"/><rect x="727.5" y="576.25" width="45.0" height="67.5" rx="11.25" fill="#5b91bf" fill-opacity=".65" stroke="#315c84" stroke-width="2"/><text x="716.25" y="542.5" font-size="19" fill="#263c37" text-anchor="middle" font-weight="400" class="label">开A时，移向B右段</text><path d="M630.0 640.0L840.0 737.5" stroke="#ad8a35" stroke-width="1.5" stroke-dasharray="4 5"/><path d="M630.0 640.0L840.0 857.5" stroke="#ad8a35" stroke-width="1.5" stroke-dasharray="4 5"/><circle cx="630.0" cy="640.0" r="11" fill="#dfbc51" stroke="#9d7a29" stroke-width="2"/><text x="630.0" y="622.0" font-size="19" fill="#263c37" text-anchor="middle" font-weight="400" class="label">同组上侧访问</text><path d="M960.0 640.0L840.0 737.5" stroke="#ad8a35" stroke-width="1.5" stroke-dasharray="4 5"/><path d="M960.0 640.0L840.0 857.5" stroke="#ad8a35" stroke-width="1.5" stroke-dasharray="4 5"/><circle cx="960.0" cy="640.0" r="11" fill="#dfbc51" stroke="#9d7a29" stroke-width="2"/><text x="960.0" y="622.0" font-size="19" fill="#263c37" text-anchor="middle" font-weight="400" class="label">同组下落控制</text><path d="M960.0 1165.0L840.0 737.5" stroke="#ad8a35" stroke-width="1.5" stroke-dasharray="4 5"/><path d="M960.0 1165.0L840.0 857.5" stroke="#ad8a35" stroke-width="1.5" stroke-dasharray="4 5"/><circle cx="960.0" cy="1165.0" r="11" fill="#dfbc51" stroke="#9d7a29" stroke-width="2"/><text x="960.0" y="1147.0" font-size="19" fill="#263c37" text-anchor="middle" font-weight="400" class="label">底侧同组访问</text><circle cx="360.0" cy="490.0" r="11" fill="white" stroke="#256776" stroke-width="3"/><path d="M347.0 490.0L317.0 490.0" stroke="#256776" stroke-width="3" marker-end="url(#arrow)"/><text x="297.0" y="498.0" font-size="28" fill="#263c37" text-anchor="middle" font-weight="700" class="label">L</text><circle cx="960.0" cy="1330.0" r="11" fill="white" stroke="#256776" stroke-width="3"/><path d="M960.0 1301.0V1359.0" stroke="#256776" stroke-width="3" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="978.0" y="1312.0" font-size="22" fill="#263c37" text-anchor="start" font-weight="700" class="label">B 可穿·双向</text><text x="40" y="1368.0" font-size="22" fill="#263c37" text-anchor="start" font-weight="600" class="label">曲线是动作意图，矩阵是逐方向目标；身体、时机、资源和接缝均UNKNOWN。</text><rect x="400" y="1387.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="450.0" y="1408.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">起点→终点</text><rect x="500" y="1387.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="550.0" y="1408.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">L</text><rect x="600" y="1387.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="650.0" y="1408.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">B</text><rect x="400" y="1416.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="450.0" y="1437.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">L</text><rect x="500" y="1416.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="550.0" y="1437.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">—</text><rect x="600" y="1416.0" width="100" height="29" fill="#e3eee1" stroke="#c7d0c4"/><text x="650.0" y="1437.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">目标</text><rect x="400" y="1445.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="450.0" y="1466.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">B</text><rect x="500" y="1445.0" width="100" height="29" fill="#e3eee1" stroke="#c7d0c4"/><text x="550.0" y="1466.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">目标</text><rect x="600" y="1445.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="650.0" y="1466.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">—</text><text x="40" y="1613.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">① 初态：A实体且右段有刺，B无碰撞；蓝虚框是B切换后会伸出的左段刺。</text><text x="40" y="1645.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">② 第一次切换：A撤去，B成接脚面，要落右段；第二次才撤B继续下行。</text><text x="40" y="1677.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">③ 回程先成B、开A，从B恢复后经开放A回左岸，不把自己关在A下方。</text><text x="40" y="1709.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">④ 井盖/危险面一致换态尚缺绑定；真实枪次、防夹、恢复与绕行全部待验。</text><text x="40" y="1764.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">绿＝固定地貌／可穿岸　紫＝井盖或互补支撑　红＝已伸出地刺／原生怪　虚框＝另一相位/状态</text><text x="40" y="1798.0" font-size="18" fill="#263c37" text-anchor="start" font-weight="400" class="label">设计稿：每格 128 px；曲线仅表达玩法意图，不代表实际动作、可达性或技术认证。</text><text x="40" y="1832.0" font-size="16" fill="#263c37" text-anchor="start" font-weight="400" class="label">3×5 Block · idea-spec02-s09-001 · 设计讨论</text></svg>