" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">—</text><rect x="800" y="1386.0" width="280" height="146" rx="8" fill="#f0f3ec" stroke="#a4b490"/><text x="940" y="1410.0" font-size="18" fill="#263c37" text-anchor="middle" font-weight="400" class="label">锯在上 → 走下缝</text><path d="M828 1426.0H1052M828 1502.8H1052" stroke="#697e60" stroke-width="6"/><polygon points="956.0,1442.0 950.3547248578188,1444.774540163499 953.856406460551,1450.0 947.5801846943198,1449.5801846943198 948.0,1455.856406460551 942.7745401634991,1452.3547248578188 940.0,1458.0 937.2254598365009,1452.3547248578188 932.0,1455.856406460551 932.4198153056802,1449.5801846943198 926.143593539449,1450.0 929.6452751421812,1444.774540163499 924.0,1442.0 929.6452751421812,1439.225459836501 926.143593539449,1434.0 932.4198153056802,1434.4198153056802 932.0,1428.143593539449 937.2254598365009,1431.6452751421812 940.0,1426.0 942.7745401634991,1431.6452751421812 948.0,1428.143593539449 947.5801846943198,1434.4198153056802 953.856406460551,1434.0 950.3547248578188,1439.225459836501" fill="#d65345" stroke="#923e36"/><rect x="835" y="1466.0" width="19.200000000000003" height="28.8" rx="4" fill="#81b7dc" stroke="#447a9f"/><path d="M865 1480.4H1042" stroke="#157f84" stroke-width="3" marker-end="url(#arrow)"/><text x="940" y="1520.0" font-size="16" fill="#263c37" text-anchor="middle" font-weight="400" class="label">图中当前相位示例</text><rect x="1095" y="1386.0" width="280" height="146" rx="8" fill="#f0f3ec" stroke="#a4b490"/><text x="1235" y="1410.0" font-size="18" fill="#263c37" text-anchor="middle" font-weight="400" class="label">锯在下 → 走上缝</text><path d="M1123 1426.0H1347M1123 1502.8H1347" stroke="#697e60" stroke-width="6"/><polygon points="1251.0,1486.8 1245.3547248578188,1489.574540163499 1248.856406460551,1494.8 1242.5801846943198,1494.3801846943197 1243.0,1500.656406460551 1237.774540163499,1497.1547248578188 1235.0,1502.8 1232.225459836501,1497.1547248578188 1227.0,1500.656406460551