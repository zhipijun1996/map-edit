<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="670" viewBox="0 0 1040 670" role="img"><title>J04 扇门前庭：未验证的空间构图与有向意图</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#7ed2bf"/></marker><marker id="control" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#ddb97a"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M-2,10 L10,-2 M8,12 L12,8" stroke="#526071" stroke-width="1"/></pattern></defs><rect width="1040" height="670" rx="16" fill="#121b25"/><g font-family="Noto Sans CJK SC,Microsoft Yahei,system-ui,sans-serif"><text x="32" y="44" font-size="27" fill="#f1eee4">J04 · 扇门前庭</text><text x="32" y="76" font-size="14" fill="#aeb8c4">3 个地区接口 · 空间创意提案 · 所有物理证据 UNKNOWN</text><rect x="24" y="94" width="500" height="454" rx="12" fill="#1b2935" stroke="#344a5c"/><text x="42" y="116" font-size="12" fill="#aeb8c4">空间构图（概念比例；线是去向意图，不是跳跃轨迹）</text><polygon points="192.5,488.0 328.5,488.0 328.5,520.0 192.5,520.0" fill="#3b4b59" stroke="#71818e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="192.5,488.0 328.5,488.0 328.5,520.0 192.5,520.0" fill="url(#hatch)" opacity=".5"/><polygon points="48.0,232.0 133.0,232.0 196.8,308.0 171.2,340.0 103.2,280.0 48.0,280.0" fill="#3b4b59" stroke="#71818e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="48.0,232.0 133.0,232.0 196.8,308.0 171.2,340.0 103.2,280.0 48.0,280.0" fill="url(#hatch)" opacity=".5"/><polygon points="388.0,232.0 473.0,232.0 473.0,280.0 417.8,280.0 349.8,340.0 324.2,308.0" fill="#3b4b59" stroke="#71818e" stroke-width="1.4" stroke-linejoin="round"/><polygon points="388.0,232.0 473.0,232.0 473.0,280.0 417.8,280.0 349.8,340.0 324.2,308.0" fill="url(#hatch)" opacity=".5"/><path d="M260.5,480.0  L260.5,372.0" fill="none" stroke="#7ed2bf" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity=".85" marker-end="url(#arrow)"/><path d="M260.5,372.0 Q239.25,140.0 77.75,216.0" fill="none" stroke="#7ed2bf" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity=".85" marker-end="url(#arrow)"/><path d="M260.5,372.0 Q281.75,140.0 443.25,216.0" fill="none" stroke="#7ed2bf" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" opacity=".85" marker-end="url(#arrow)"/><path d="M332.75,328.0 Q260.5,168.0 77.75,216.0" fill="none" stroke="#ddb97a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#control)"/><path d="M188.25,328.0 Q260.5,168.0 443.25,216.0" fill="none" stroke="#ddb97a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#control)"/><circle cx="260.5" cy="372.0" r="5" fill="#ddb97a"/><text x="269.5" y="363.0" font-size="12" fill="#ddb97a" paint-order="stroke" stroke="#1b2935" stroke-width="3">共同起跳庭</text><circle cx="332.75" cy="328.0" r="5" fill="#ddb97a"/><text x="341.75" y="319.0" font-size="12" fill="#ddb97a" paint-order="stroke" stroke="#1b2935" stroke-width="3">B门接收铃</text><circle cx="188.25" cy="328.0" r="5" fill="#ddb97a"/><text x="197.25" y="319.0" font-size="12" fill="#ddb97a" paint-order="stroke" stroke="#1b2935" stroke-width="3">C门接收铃</text><circle cx="260.5" cy="480.0" r="12" fill="#182330" stroke="#80cfc0" stroke-width="2"/><text x="260.5" y="485.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#80cfc0">A</text><text x="278.5" y="462.0" text-anchor="start" font-size="13" fill="#80cfc0" paint-order="stroke" stroke="#1b2935" stroke-width="3">低庭来路</text><circle cx="77.75" cy="216.0" r="12" fill="#182330" stroke="#e3c58f" stroke-width="2"/><text x="77.75" y="221.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e3c58f">B</text><text x="95.75" y="245.0" text-anchor="start" font-size="13" fill="#e3c58f" paint-order="stroke" stroke="#1b2935" stroke-width="3">西翼地区</text><circle cx="443.25" cy="216.0" r="12" fill="#182330" stroke="#e3c58f" stroke-width="2"/><text x="443.25" y="221.0" text-anchor="middle" font-size="14" font-weight="bold" fill="#e3c58f">C</text><text x="425.25" y="245.0" text-anchor="end" font-size="13" fill="#e3c58f" paint-order="stroke" stroke="#1b2935" stroke-width="3">东翼地区</text><text x="566" y="119" font-size="18" fill="#eee8d8">有向关系：设计意图</text><text x="566" y="143" font-size="12" fill="#aeb8c4">行＝从哪里来；列＝去哪里。不是可达性结论。</text><text x="645" y="161" text-anchor="middle" font-size="14" fill="#dedace">A</text><text x="612" y="189" font-size="14" fill="#dedace">A</text><rect x="630" y="166" width="33" height="33" rx="4" fill="#17212b"/><text x="646" y="189" text-anchor="middle" font-size="17" fill="#d9e1df">—</text><rect x="668" y="166" width="33" height="33" rx="4" fill="#254f4e"/><text x="684" y="189" text-anchor="middle" font-size="17" fill="#d9e1df">→</text><rect x="706" y="166" width="33" height="33" rx="4" fill="#254f4e"/><text x="722" y="189" text-anchor="middle" font-size="17" fill="#d9e1df">→</text><text x="683" y="161" text-anchor="middle" font-size="14" fill="#dedace">B</text><text x="612" y="227" font-size="14" fill="#dedace">B</text><rect x="630" y="204" width="33" height="33" rx="4" fill="#254f4e"/><text x="646" y="227" text-anchor="middle" font-size="17" fill="#d9e1df">→</text><rect x="668" y="204" width="33" height="33" rx="4" fill="#17212b"/><text x="684" y="227" text-anchor="middle" font-size="17" fill="#d9e1df">—</text><rect x="706" y="204" width="33" height="33" rx="4" fill="#293541"/><text x="722" y="227" text-anchor="middle" font-size="17" fill="#d9e1df">?</text><text x="721" y="161" text-anchor="middle" font-size="14" fill="#dedace">C</text><text x="612" y="265" font-size="14" fill="#dedace">C</text><rect x="630" y="242" width="33" height="33" rx="4" fill="#254f4e"/><text x="646" y="265" text-anchor="middle" font-size="17" fill="#d9e1df">→</text><rect x="668" y="242" width="33" height="33" rx="4" fill="#293541"/><text x="684" y="265" text-anchor="middle" font-size="17" fill="#d9e1df">?</text><rect x="706" y="242" width="33" height="33" rx="4" fill="#17212b"/><text x="722" y="265" text-anchor="middle" font-size="17" fill="#d9e1df">—</text><text x="566" y="302" font-size="12" fill="#aeb8c4">→ 希望通行　× 希望限制反向　? 未请求</text><text x="566" y="340" font-size="16" fill="#e3c58f">玩家选择</text><text x="566" y="363" font-size="15" fill="#dae0e4">选西翼B时，瞄东侧的B门接收铃，打开西门并向西反</text><text x="566" y="386" font-size="15" fill="#dae0e4">冲；选东翼C时，瞄西侧的C门接收铃，打开东门并向</text><text x="566" y="409" font-size="15" fill="#dae0e4">东反冲。先开过两门时也应保留左右地貌和地区去向</text><text x="566" y="432" font-size="15" fill="#dae0e4">的选择。</text><text x="42" y="578" font-size="15" fill="#ddb97a">原 Cell 可复用 / 生成规则与验证待做</text><text x="42" y="608" font-size="13" fill="#aeb8c4">拟定局部构图；所有来回方向、身体净空与资源条件尚未验证。</text><text x="42" y="637" font-size="14" fill="#f1b997">提案 / NOT_RUN　·　不是可玩样品、不是生产批准</text></g></svg>