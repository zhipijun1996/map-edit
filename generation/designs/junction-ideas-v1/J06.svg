ext-anchor="end" font-size="13" fill="#e3c58f" paint-order="stroke" stroke="#1b2935" stroke-width="3">东侧风口</text><text x="566" y="119" font-size="18" fill="#eee8d8">有向关系：设计意图</text><text x="566" y="143" font-size="12" fill="#aeb8c4">行＝从哪里来；列＝去哪里。不是可达性结论。</text><text x="645" y="161" text-anchor="middle" font-size="14" fill="#dedace">A</text><text x="612" y="189" font-size="14" fill="#dedace">A</text><rect x="630" y="166" width="33" height="33" rx="4" fill="#17212b"/><text x="646" y="189" text-anchor="middle" font-size="17" fill="#d9e1df">—</text><rect x="668" y="166" width="33" height="33" rx="4" fill="#254f4e"/><text x="684" y="189" text-anchor="middle" font-size="17" fill="#d9e1df">→</text><rect x="706" y="166" width="33" height="33" rx="4" fill="#254f4e"/><text x="722" y="189" text-anchor="middle" font-size="17" fill="#d9e1df">→</text><text x="683" y="161" text-anchor="middle" font-size="14" fill="#dedace">B</text><text x="612" y="227" font-size="14" fill="#dedace">B</text><rect x="630" y="204" width="33" height="33" rx="4" fill="#5b3f40"/><text x="646" y="227" text-anchor="middle" font-size="17" fill="#d9e1df">×</text><rect x="668" y="204" width="33" height="33" rx="4" fill="#17212b"/><text x="684" y="227" text-anchor="middle" font-size="17" fill="#d9e1df">—</text><rect x="706" y="204" width="33" height="33" rx="4" fill="#254f4e"/><text x="722" y="227" text-anchor="middle" font-size="17" fill="#d9e1df">→</text><text x="721" y="161" text-anchor="middle" font-size="14" fill="#dedace">C</text><text x="612" y="265" font-size="14" fill="#dedace">C</text><rect x="630" y="242" width="33" height="33" rx="4" fill="#5b3f40"/><text x="646" y="265" text-anchor="middle" font-size="17" fill="#d9e1df">×</text><rect x="668" y="242" width="33" height="33" rx="4" fill="#254f4e"/><text x="684" y="265" text-anchor="middle" font-size="17" fill="#d9e1df">→</text><rect x="706" y="242" width="33" height="33" rx="4" fill="#17212b"/><text x="722" y="265" text-anchor="middle" font-size="17" fill="#d9e1df">—</text><text x="566" y="302" font-size="12" fill="#aeb8c4">→ 希望通行　× 希望限制反向　? 未请求</text><text x="566" y="340" font-size="16" fill="#e3c58f">玩家选择</text><text x="566" y="363" font-size="15" fill="#dae0e4">从高口A进入时，向东C继续还是下到B接另一条低层</text><text x="566" y="386" font-size="15" fill="#dae0e4">地区路；从B进入时，主要任务是利用地形抬升到C。</text><text x="566" y="409" font-size="15" fill="#dae0e4">这里可以是平静、低强度的地区节点。</text><text x="42" y="578" font-size="15" fill="#ddb97a">原 Cell 可复用 / 生成规则与验证待做</text><text x="42" y="608" font-size="13" fill="#aeb8c4">拟定局部构图；所有来回方向、身体净空与资源条件尚未验证。</text><text x="42" y="637" font-size="14" fill="#f1b997">提案 / NOT_RUN　·　不是可玩样品、不是生产批准</text></g></svg>