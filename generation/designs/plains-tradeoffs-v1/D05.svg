<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="560" viewBox="0 0 1320 560"><defs><marker id="213b44" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#213b44"/></marker><marker id="536d77" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#536d77"/></marker><marker id="728f83" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#728f83"/></marker><marker id="356c91" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#356c91"/></marker><marker id="df8a38" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#df8a38"/></marker><marker id="b94a43" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#b94a43"/></marker><marker id="16826e" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#16826e"/></marker><marker id="8051aa" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8051aa"/></marker></defs><rect width="1320" height="560" fill="#f5f6ef"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="25" y="38" font-size="27" fill="#213b44">D05 · 同一枪：把落点往右送，也把人物推向左上</text><text x="25" y="69" font-size="17" fill="#536d77">新Cell假设 · 受弹滑箱尚未完成这套验证 · 箭头表示作用方向，不是已验证轨迹</text><rect x="20" y="96" width="625" height="350" rx="5" fill="#ffffff" stroke="#d4dfd9" stroke-width="2"/><rect x="665" y="96" width="635" height="350" rx="5" fill="#ffffff" stroke="#d4dfd9" stroke-width="2"/><text x="40" y="130" font-size="21" fill="#213b44">① 开枪时：一次行动产生两个方向相反的效果</text><circle cx="235" cy="200" r="8" fill="#df8a38"/><rect x="228" y="210" width="14" height="25" rx="5" fill="#df8a38"/><rect x="340" y="300" width="90" height="55" rx="5" fill="#b78758"/><text x="350" y="333" font-size="18" fill="#ffffff">木箱</text><path d="M320,360 H575 M320,347 V370 M575,347 V370" fill="none" stroke="#536d77" stroke-width="4"/><rect x="550" y="205" width="75" height="80" rx="5" fill="#728f83"/><text x="550" y="190" font-size="17" fill="#213b44">远岸</text><path d="M247,210 L355,292" fill="none" stroke="#8051aa" stroke-width="3" marker-end="url(#8051aa)"/><text x="295" y="229" font-size="18" fill="#8051aa">弹丸向右下</text><path d="M221,208 L150,151" fill="none" stroke="#df8a38" stroke-width="3" marker-end="url(#df8a38)"/><text x="42" y="176" font-size="18" fill="#df8a38">人物反冲：左上</text><path d="M432,315 L510,315" fill="none" stroke="#356c91" stroke-width="3" marker-end="url(#356c91)"/><text x="439" y="298" font-size="18" fill="#356c91">箱子：向右</text><text x="40" y="418" font-size="18" fill="#213b44">箱子离远岸更近；人物与箱子的横向距离却扩大。</text><text x="685" y="130" font-size="21" fill="#213b44">② 命中后：需要追上新落点，再从箱上继续</text><circle cx="810" cy="191" r="8" fill="#df8a38"/><rect x="803" y="201" width="14" height="25" rx="5" fill="#df8a38"/><rect x="1000" y="300" width="90" height="55" rx="5" fill="#b78758"/><text x="1007" y="332" font-size="17" fill="#ffffff">新落点</text><rect x="1210" y="205" width="75" height="80" rx="5" fill="#728f83"/><text x="1208" y="190" font-size="17" fill="#213b44">远岸</text><path d="M940,360 H1180 M940,347 V370 M1180,347 V370" fill="none" stroke="#536d77" stroke-width="4"/><path d="M830,230 L1035,289" fill="none" stroke="#16826e" stroke-width="3" marker-end="url(#16826e)"/><text x="853" y="252" font-size="18" fill="#16826e">用空中移动追回箱子</text><path d="M1094,290 L1222,194" fill="none" stroke="#16826e" stroke-width="3" marker-end="url(#16826e)"/><text x="1082" y="178" font-size="17" fill="#16826e">踩稳后再跳</text><text x="685" y="393" font-size="17" fill="#213b44">向上的反冲也可能延长滞空：既有收益，也有代价。</text><text x="685" y="423" font-size="17" fill="#213b44">要选择起跳位置、开枪时机与角度，保留追箱余量。</text><text x="25" y="486" font-size="18" fill="#b94a43">关键反证：若能站在岸上先把箱推好，再轻松跳过去，“同枪处理两件事”的玩法就没有成立。</text><text x="25" y="525" font-size="18" fill="#213b44">需要验证：遮挡、距离、高度、箱速与恢复；不能只靠两根相反箭头就宣称有趣。</text></g></svg>