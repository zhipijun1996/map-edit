fill="#df8a38"/><rect x="157" y="160" width="14" height="25" rx="5" fill="#df8a38"/><path d="M72,242 L285,311" fill="none" stroke="#8051aa" stroke-width="3" marker-end="url(#8051aa)"/><text x="28" y="325" font-size="16" fill="#8051aa">载台持续向右下</text><path d="M130,160 L178,160" fill="none" stroke="#b94a43" stroke-width="3" marker-end="url(#b94a43)"/></g><text x="23" y="475" font-size="16" fill="#b94a43">人还不够低，完整身体会撞到悬岩近侧。</text><g transform="translate(455,100)"><rect x="0" y="0" width="425" height="350" rx="5" fill="#ffffff" stroke="#d4dfd9" stroke-width="2"/><text x="16" y="29" font-size="22" fill="#16826e">② 下降后抢前缘</text><rect x="165" y="65" width="110" height="115" rx="5" fill="#728f83"/><text x="172" y="95" font-size="18" fill="#ffffff">悬岩</text><rect x="350" y="190" width="60" height="80" rx="5" fill="#728f83"/><text x="348" y="178" font-size="16" fill="#213b44">远岸</text><rect x="150" y="240" width="155" height="14" rx="5" fill="#356c91"/><circle cx="265" cy="205" r="8" fill="#df8a38"/><rect x="258" y="215" width="14" height="25" rx="5" fill="#df8a38"/><path d="M72,242 L285,311" fill="none" stroke="#8051aa" stroke-width="3" marker-end="url(#8051aa)"/><text x="28" y="325" font-size="16" fill="#8051aa">载台持续向右下</text><path d="M280,210 L359,176" fill="none" stroke="#16826e" stroke-width="3" marker-end="url(#16826e)"/></g><text x="463" y="475" font-size="16" fill="#16826e">净空打开，趁离台高度仍够时跳向远岸。</text><g transform="translate(895,100)"><rect x="0" y="0" width="425" height="350" rx="5" fill="#ffffff" stroke="#d4dfd9" stroke-width="2"/><text x="16" y="29" font-size="22" fill="#b94a43">③ 一直拖延</text><rect x="165" y="65" width="110" height="115" rx="5" fill="#728f83"/><text x="172" y="95" font-size="18" fill="#ffffff">悬岩</text><rect x="350" y="190" width="60" height="80" rx="5" fill="#728f83"/><text x="348" y="178" font-size="16" fill="#213b44">远岸</text><rect x="220" y="325" width="155" height="14" rx="5" fill="#356c91"/><circle cx="330" cy="290" r="8" fill="#df8a38"/><rect x="323" y="300" width="14" height="25" rx="5" fill="#df8a38"/><path d="M72,242 L285,311" fill="none" stroke="#8051aa" stroke-width="3" marker-end="url(#8051aa)"/><text x="28" y="325" font-size="16" fill="#8051aa">载台持续向右下</text><path d="M365,308 L365,197" fill="none" stroke="#b94a43" stroke-width="3" marker-end="url(#b94a43)"/><text x="286" y="244" font-size="15" fill="#b94a43">高差增大</text></g><text x="903" y="475" font-size="16" fill="#b94a43">台继续下沉，去远岸所需的抬升越来越大。</text><text x="25" y="510" font-size="18" fill="#213b44">要形成玩法，必须验证“能通过的中间窗口”；若岸上预停或站着不动就能过，这个设计关系就没有成立。</text></g></svg>