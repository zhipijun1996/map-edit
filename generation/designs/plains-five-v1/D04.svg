<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460"><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#198577"/></marker></defs><rect width="960" height="460" fill="#f6f5ed"/><g font-family="system-ui,sans-serif"><text x="24" y="35" font-size="25" fill="#253b37">D04  给回程留一块落脚地</text><text x="24" y="63" font-size="15" fill="#738279">概念侧视示意 · 非真实比例 / 未求解轨迹 / 未运行 Godot</text><rect x="40" y="155" width="290" height="60" rx="7" fill="#698571"/><rect x="535" y="155" width="370" height="60" rx="7" fill="#698571"/><circle cx="260" cy="113" r="10" fill="#df884b"/><rect x="252" y="123" width="16" height="22" rx="4" fill="#df884b"/><rect x="40" y="340" width="210" height="50" rx="7" fill="#698571"/><rect x="760" y="340" width="145" height="50" rx="7" fill="#698571"/><rect x="825" y="315" width="36" height="25" rx="4" fill="#d5ac4d" stroke="#7b6439"/><text x="820" y="305" font-size="16" fill="#253b37">宝箱</text><rect x="455" y="325" width="140" height="16" rx="7" fill="#698571"/><rect x="645" y="325" width="140" height="16" rx="5" fill="none" stroke="#965bb5" stroke-width="3" stroke-dasharray="8 6"/><path d="M280 125 L630 125" stroke="#198577" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow)"/><text x="455.0" y="115.0" font-size="16" fill="#198577">上层去程：同枪跨缺口并停台</text><path d="M810 295 L250 295" stroke="#198577" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow)"/><text x="530.0" y="285.0" font-size="16" fill="#198577">下层回程，读取先前停位</text><text x="382" y="367" font-size="18" fill="#253b37">中位：利于返回</text><text x="642" y="400" font-size="18" fill="#253b37">右位：利于取宝</text><text x="110" y="250" font-size="18" fill="#253b37">两个台位是选择状态，不是两块平台</text><text x="24" y="433" font-size="15" fill="#738279">虚线仅表达设计意图；所有端口通行、完整身体净空及恢复均未验证。</text></g></svg>