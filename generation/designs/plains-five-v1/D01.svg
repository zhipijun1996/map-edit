<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460"><defs><marker id="arrow" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#198577"/></marker></defs><rect width="960" height="460" fill="#f6f5ed"/><g font-family="system-ui,sans-serif"><text x="24" y="35" font-size="25" fill="#253b37">D01  背着宝箱，开第一枪</text><text x="24" y="63" font-size="15" fill="#738279">概念侧视示意 · 非真实比例 / 未求解轨迹 / 未运行 Godot</text><rect x="45" y="245" width="220" height="80" rx="7" fill="#698571"/><rect x="540" y="170" width="350" height="80" rx="7" fill="#698571"/><rect x="235" y="355" width="640" height="35" rx="7" fill="#698571"/><rect x="235" y="315" width="70" height="40" rx="7" fill="#698571"/><rect x="205" y="280" width="55" height="75" rx="7" fill="#698571"/><circle cx="220" cy="203" r="10" fill="#df884b"/><rect x="212" y="213" width="16" height="22" rx="4" fill="#df884b"/><rect x="770" y="145" width="36" height="25" rx="4" fill="#d5ac4d" stroke="#7b6439"/><text x="765" y="135" font-size="16" fill="#253b37">宝箱</text><path d="M230 200 L605 145" stroke="#198577" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow)"/><text x="417.5" y="162.5" font-size="16" fill="#198577">拟议反冲：向右上</text><path d="M215 220 L130 260" stroke="#965bb5" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow)"/><text x="172.5" y="230.0" font-size="16" fill="#965bb5">枪口向左下</text><path d="M470 330 L260 285" stroke="#198577" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow)"/><text x="365.0" y="297.5" font-size="16" fill="#198577">落空后走回 A</text><text x="70" y="235" font-size="18" fill="#253b37">A 出发岸</text><text x="630" y="280" font-size="18" fill="#253b37">B 目标岸</text><text x="390" y="380" font-size="18" fill="#253b37">C 无刺回收地</text><text x="295" y="115" font-size="18" fill="#253b37">普通跳不足；宽接收岸提供容错</text><text x="24" y="433" font-size="15" fill="#738279">虚线仅表达设计意图；所有端口通行、完整身体