0" y="974.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="750.0" y="995.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">—</text><text x="40" y="1113.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">① A高口下落到中庭，选择低B或沿阶台向C；中庭一空怪、阶台一陆怪。</text><text x="40" y="1145.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">② B/C回A：跳跃与反冲到新增可穿小落点，再上返高岸；不增加恢复点。</text><text x="40" y="1177.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">③ 三口六向目标见矩阵；图中小落点是新增设计，身体净空、资源与每方向真实通行待验。</text><text x="40" y="1232.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">图例：红＝原危险面/齿轮　蓝色墙边＝可蹬墙　蓝虚线＝动作意图　绿＝地貌</text><text x="40" y="1266.0" font-size="18" fill="#263c37" text-anchor="start" font-weight="400" class="label">设计稿：每格 128 px；曲线仅表达玩法意图，不代表实际动作、可达性或技术认证。</text><text x="40" y="1300.0" font-size="16" fill="#263c37" text-anchor="start" font-weight="400" class="label">7×5 Block · junction-j06-0 · 设计讨论</text></svg>