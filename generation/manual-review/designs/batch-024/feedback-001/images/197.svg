e="22" fill="#263c37" text-anchor="start" font-weight="700" class="label">exit</text><text x="40" y="834.6666666666666" font-size="22" fill="#263c37" text-anchor="start" font-weight="600" class="label">玩法：先冒险下探露出低铃弹道，再用同一枪收回高度。</text><text x="40" y="869.6666666666666" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">① 左岸向右走出，落到竖直侧壁下缘以下；上面瞄低铃时，弹道会被侧壁遮住。</text><text x="40" y="901.6666666666666" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">② 在侧壁下方朝左下射中低铃，右侧紫色门区打开；同枪反冲把人物推向右上。</text><text x="40" y="933.6666666666666" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">③ 收回高度，落到右岸宝箱台再离开。紫色大块是门，不是岩体；下方长台是原恢复区。</text><text x="40" y="988.6666666666666" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">图例：蓝虚线＝射击/动作意图　绿箭头＝反冲　金＝风铃/奖励　紫＝门</text><text x="40" y="1022.6666666666666" font-size="18" fill="#263c37" text-anchor="start" font-weight="400" class="label">设计稿：每格 128 px；曲线仅表达玩法意图，不代表实际动作、可达性或技术认证。</text><text x="40" y="1056.6666666666665" font-size="16" fill="#263c37" text-anchor="start" font-weight="400" class="label">15×8 Block · generated-769066fe5fa1b2332bd7d35c56fa814f01db2b06eb8c65ef9ecf1e586db3ca0b · 设计讨论</text></svg>