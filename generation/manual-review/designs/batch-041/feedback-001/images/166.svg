="400" y="945.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="450.0" y="966.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">exit</text><rect x="500" y="945.0" width="100" height="29" fill="#e3eee1" stroke="#c7d0c4"/><text x="550.0" y="966.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">目标</text><rect x="600" y="945.0" width="100" height="29" fill="#f1f0e9" stroke="#c7d0c4"/><text x="650.0" y="966.0" font-size="17" fill="#263c37" text-anchor="middle" font-weight="400" class="label">—</text><text x="40" y="1113.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">① 左裁三列、右裁两列，保留坑底危险带。</text><text x="40" y="1145.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">② 高右岸上移16px，对齐新高出口；低左口支撑不变。</text><text x="40" y="1177.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">③ 去程跳跃/反冲攀升，返程另画下落回岸，双向实际动作和容错待验。</text><text x="40" y="1232.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">图例：红＝原危险面/齿轮　蓝色墙边＝可蹬墙　蓝虚线＝动作意图　绿＝地貌</text><text x="40" y="1266.0" font-size="18" fill="#263c37" text-anchor="start" font-weight="400" class="label">设计稿：每格 128 px；曲线仅表达玩法意图，不代表实际动作、可达性或技术认证。</text><text x="40" y="1300.0" font-size="16" fill="#263c37" text-anchor="start" font-weight="400" class="label">5×4 Block · game-recoil-shaft · 设计讨论</text></svg>