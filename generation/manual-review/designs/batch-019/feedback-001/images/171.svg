">宝箱 12</text><circle cx="95.0" cy="616.1111111111111" r="11" fill="white" stroke="#256776" stroke-width="3"/><path d="M82.0 616.1111111111111L52.0 616.1111111111111" stroke="#256776" stroke-width="3" marker-end="url(#arrow)"/><text x="77.0" y="596.1111111111111" font-size="22" fill="#263c37" text-anchor="end" font-weight="700" class="label">entry</text><circle cx="1345.0" cy="616.1111111111111" r="11" fill="white" stroke="#256776" stroke-width="3"/><path d="M1358.0 616.1111111111111L1388.0 616.1111111111111" stroke="#256776" stroke-width="3" marker-end="url(#arrow)"/><text x="1363.0" y="596.1111111111111" font-size="22" fill="#263c37" text-anchor="start" font-weight="700" class="label">exit</text><text x="40" y="862.4444444444445" font-size="22" fill="#263c37" text-anchor="start" font-weight="600" class="label">玩法：诱导陆怪攻击，让敌人的攻击状态替你打开低门。</text><text x="40" y="897.4444444444445" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">① 靠近台上的陆怪，诱导它进入真正的攻击态；金色方框是攻击继电器，不是可射击铃。</text><text x="40" y="929.4444444444445" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">② 攻击态使低门开启1秒；抢穿岩层下42px通道，里面有12金币宝箱。</text><text x="40" y="961.4444444444445" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">③ 门后继续到右口；原可达证据有范围，不能据此认定任意时机或返回都可靠。</text><text x="40" y="1016.4444444444445" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">图例：金框＝状态检测（非风铃）　蓝虚线＝动作/载台时刻示意　紫＝门　绿＝地貌</text><text x="40" y="1050.4444444444443" font-size="18" fill="#263c37" text-anchor="start" font-weight="400" class="label">设计稿：每格 128 px；曲线仅表达玩法意图，不代表实际动作、可达性或技术认证。</text><text x="40" y="1084.4444444444443" font-size="16" fill="#263c37" text-anchor="start" font-weight="400" class="label">9×5 Block · generated-011d0a163822daaeea61e2280dbe4b26f7f48fa38d57ac30d06110da0634723b · 设计讨论</text></svg>