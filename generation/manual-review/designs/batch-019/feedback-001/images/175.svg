2352941177" cy="507.98713235294116" r="11" fill="#dfbc51" stroke="#9d7a29" stroke-width="2"/><text x="862.4632352941177" y="489.98713235294116" font-size="19" fill="#263c37" text-anchor="middle" font-weight="400" class="label">铃2</text><rect x="1245.8327205882354" y="531.4540441176471" width="26" height="22" rx="3" fill="#ecc65b" stroke="#956b25" stroke-width="2"/><text x="1258.8327205882354" y="521.4540441176471" font-size="19" fill="#263c37" text-anchor="middle" font-weight="400" class="label">宝箱 8</text><circle cx="95.0" cy="534.4117647058824" r="11" fill="white" stroke="#256776" stroke-width="3"/><path d="M82.0 534.4117647058824L52.0 534.4117647058824" stroke="#256776" stroke-width="3" marker-end="url(#arrow)"/><text x="77.0" y="514.4117647058824" font-size="22" fill="#263c37" text-anchor="end" font-weight="700" class="label">entry</text><circle cx="1345.0" cy="534.4117647058824" r="11" fill="white" stroke="#256776" stroke-width="3"/><path d="M1358.0 534.4117647058824L1388.0 534.4117647058824" stroke="#256776" stroke-width="3" marker-end="url(#arrow)"/><text x="1363.0" y="514.4117647058824" font-size="22" fill="#263c37" text-anchor="start" font-weight="700" class="label">exit</text><text x="40" y="682.7058823529412" font-size="22" fill="#263c37" text-anchor="start" font-weight="600" class="label">玩法：同一移动台先当远程钥匙，再放开它来载人。</text><text x="40" y="717.7058823529412" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">① 射铃启动载台，再射暂停，让台身停在检测区；只有指定载台实体占位才持续开门。</text><text x="40" y="749.7058823529412" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">② 人先过右边高门；用返回侧铃再次启台，载台离开检测区后门会关闭，原短延时0.18秒。</text><text x="40" y="781.7058823529412" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">③ 到沟边接住同一载台，再跳向右岸宝箱。淡蓝虚框是同一台的不同时刻位置，不是新增平台。</text><text x="40" y="836.7058823529412" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">图例：金框＝状态检测（非风铃）　蓝虚线＝动作/载台时刻示意　紫＝门　绿＝地貌</text><text x="40" y="870.7058823529412" font-size="18" fill="#263c37" text-anchor="start" font-weight="400" class="label">设计稿：每格 128 px；曲线仅表达玩法意图，不代表实际动作、可达性或技术认证。</text><text x="40" y="904.7058823529412" font-size="16" fill="#263c37" text-anchor="start" font-weight="400" class="label">17×7 Block · generated-1ff2da49936b180bfa76a3285e8392db0f5945aff17b746dac48511bfe9b23a9 · 设计讨论</text></svg>