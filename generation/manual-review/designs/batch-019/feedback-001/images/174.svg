t-weight="700" class="label">exit</text><text x="40" y="868.0" font-size="22" fill="#263c37" text-anchor="start" font-weight="600" class="label">玩法：射击方向与目的地方向相反，靠蹬墙把反冲改回左向。</text><text x="40" y="903.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">① 从右侧进入；向左下射铃，开左侧限时门，同时人物被反冲推向右墙。</text><text x="40" y="935.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">② 贴上蓝色标记的可蹬墙面，蹬墙向左折返，穿门落到左上宝箱台，再向左口离开。</text><text x="40" y="967.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">③ 原目标需要wall_climb；它不属于只有反冲能力的内容，不能把蹬墙省略成普通跳。</text><text x="40" y="1022.0" font-size="20" fill="#263c37" text-anchor="start" font-weight="400" class="label">图例：金框＝状态检测（非风铃）　蓝虚线＝动作/载台时刻示意　紫＝门　绿＝地貌</text><text x="40" y="1056.0" font-size="18" fill="#263c37" text-anchor="start" font-weight="400" class="label">设计稿：每格 128 px；曲线仅表达玩法意图，不代表实际动作、可达性或技术认证。</text><text x="40" y="1090.0" font-size="16" fill="#263c37" text-anchor="start" font-weight="400" class="label">5×7 Block · generated-09efd9583360ae3e414d7430c9b0e7e12a730b0fe8a5f19a90fc98c9b80c2ac2 · 设计讨论</text></svg>