<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f3ed">
  <meta name="description" content="随手摆机关、画路线，把关卡想法变成可分享的草图。">
  <title>关卡手记 · Map Notes</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="header">
    <a class="brand" href="./" aria-label="关卡手记首页"><span class="brand-mark">▧</span><span>关卡手记<small>MAP NOTES</small></span></a>
    <div class="project-heading"><input id="title" aria-label="关卡名称" maxlength="80"><span id="save-status" role="status">本机自动保存</span></div>
    <nav class="header-actions" aria-label="文件操作">
      <button id="library">模块库</button>
      <button id="projects">草稿<span class="key">▾</span></button>
      <button id="import">打开工程</button>
      <button id="save-file">保存工程</button>
      <button id="export" class="primary">导出图片 <span>↗</span></button>
    </nav>
  </header>
  <main class="workspace">
    <aside class="palette" aria-label="对象工具箱">
      <div class="panel-title">素材盒 <span>点击添加 · 拖动摆放</span></div>
      <div id="palette"></div>
      <div class="palette-note"><b>先表达想法。</b><p>位置大致即可，动作和关系更重要。</p><button id="help">操作说明 ↗</button></div>
    </aside>
    <section class="studio" aria-label="关卡画布">
      <div class="toolbar">
        <div class="tool-group" id="tools">
          <button data-tool="select" class="active" title="选择 / V"><span>↖</span>选择</button>
          <button data-tool="pan" title="移动画布 / 空格"><span>✥</span>移动</button>
          <button data-tool="terrain" title="拖动绘制地块 / R"><span>▰</span>地块</button>
          <button data-tool="route" title="点击添加动作节点"><span>⤴</span>人物路线</button>
          <button data-tool="trackLine" title="点击绘制直线或折线轨道"><span>⌁</span>轨道</button>
          <button data-tool="trackArc" title="拖动绘制弧形轨道"><span>⌒</span>弧轨</button>
        </div>
        <div class="tool-group history"><button id="undo" aria-label="撤销" title="撤销 Ctrl Z">↶</button><button id="redo" aria-label="重做" title="重做 Ctrl Shift Z">↷</button><span class="divider"></span><button id="duplicate" title="复制所选对象">⧉</button><button id="delete" title="删除所选对象">⌫</button><button id="inspector-toggle" title="对象设置">☷ 设置</button></div>
      </div>
      <div class="canvas-wrap" id="canvas-wrap">
        <div class="canvas-badge"><span class="dot"></span>设计草图 <span class="badge-divider">/</span> <span id="object-count">0 个对象</span></div>
        <svg id="canvas" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="可编辑的关卡草图" tabindex="0"></svg>
        <div class="canvas-hint" id="canvas-hint">点选物体调整 · 拖动画布上的物体移动</div>
        <button id="finish-draw" class="primary floating" hidden>完成绘制 ✓</button>
        <div class="zoom"><button id="zoom-out" aria-label="缩小">−</button><button id="zoom-label" title="重置视图">100%</button><button id="zoom-in" aria-label="放大">＋</button><span></span><button id="fit" title="适合全部内容">⊡</button><button id="fullscreen" title="全屏">⛶</button></div>
      </div>
      <div class="playbar">
        <button id="play" class="play-button">▶ 演示</button><input id="time" type="range" min="0" max="20" step="0.01" value="0" aria-label="预览时间"><span id="time-label">0.0s</span><select id="route-view" aria-label="显示哪条路线" title="切换主路、支路与返回路线"></select><label class="snap"><input id="snap" type="checkbox" checked>吸附网格</label>
      </div>
      <footer class="canvas-footer"><span><i class="legend terrain"></i>地形 <i class="legend hazard"></i>危险 <i class="legend mechanism"></i>机关 <i class="legend route"></i>预期动作</span><span>草图不是物理通关证明</span></footer>
    </section>
    <aside class="inspector" id="inspector" aria-label="属性和关卡说明">
      <div class="panel-title">设计便签 <button id="close-inspector" aria-label="关闭设置">×</button></div>
      <div id="revision-info"></div>
      <div id="capability-panel"></div>
      <div id="difficulty-panel"></div>
      <div id="selection"></div>
      <section class="brief"><div class="section-heading">关卡想法 <span>随时补充</span></div><textarea id="description" rows="5" placeholder="想让玩家体验什么？哪里要等、哪里要一气呵成？"></textarea><div class="section-heading">制作时请保留</div><textarea id="constraints" rows="4" placeholder="例如：中途不能落地；下方留失败回收路线；入口能看到风铃。"></textarea><p class="subtle">图片会附上这些说明。工程文件还会保留对象、轨道和动作关系，方便后续转成游戏模块。</p></section>
      <div class="inspector-bottom">GUNMAN RUSH <span>✳</span> IDEA WORKSPACE</div>
    </aside>
  </main>
  <input id="file-input" type="file" accept=".json,.mapnote,application/json" hidden>
  <div id="toast" role="status" hidden></div>
  <dialog id="dialog"><div class="dialog-heading"><h2 id="dialog-title"></h2><button id="dialog-close" aria-label="关闭对话框">×</button></div><div id="dialog-body"></div></dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
